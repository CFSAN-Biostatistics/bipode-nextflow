name: Build and Push Bipode Container

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Extracts the short git SHA to use as the container tag
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: quay.io/galaxytrakr/bipode
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Make Container Repository Public
        run: |
          echo "Setting repository visibility to public..."
          curl -f -X POST "https://quay.io/api/v1/repository/galaxytrakr/bipode/changevisibility" \
               -H "Authorization: Bearer ${{ secrets.QUAY_OAUTH_TOKEN }}" \
               -H "Content-Type: application/json" \
               -d '{"visibility": "public"}'
